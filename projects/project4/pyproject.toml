[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "project4-3dgs-navigation-demo"
version = "0.1.0"
description = "Real laboratory Gaussian scene, A* planning, and Go2 kinematic replay"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "opencv-python==4.11.0.86",
  "plyfile==1.1.3",
  "tomli==2.5.0",
  "PyYAML==6.0.3",
  "pybullet==3.2.7",
  "imageio==2.37.0",
]

[project.optional-dependencies]
gpu = [
  "torch==2.4.0+cu121",
  "gsplat==1.5.3+pt24cu121",
  "ninja==1.13.2",
  "jaxtyping==0.3.7",
  "rich==15.0.0",
  "packaging>=24,<26",
]

[project.scripts]
project4-demo = "robotnav.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
