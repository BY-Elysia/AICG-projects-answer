[paths]
scene_dir = "assets/navigation"
trajectories_dir = "outputs/trajectories"
trajectory_manifest_filename = "trajectory_manifest.json"
ply_dir = "outputs/cache"
ply_filename = "laboratory.ply"
robot_dir = "assets/go2"
urdf_filename = "go2.urdf"
output_dir = "outputs/animation"

ground_support_path = "assets/navigation/ground_support.npz"

[video]
width = 848
height = 480
fps = 20
duration_s = 12.0
start_hold_s = 1.0
goal_hold_s = 2.0
scene_label = "Laboratory"
preview_indices = [0, 70, 140, 205, 239]

[camera]
distance_m = 1.4
height_m = 1.0
look_ahead_m = 0.25
target_height_m = 0.24
lateral_offset_m = 0.10
fov_y_deg = 65.0
near = 0.03
far = 120.0

[robot]
trajectory_id = "lab_000"
base_height_m = 0.34
gait_hz = 1.8
step_length_m = 0.20
foot_lift_m = 0.05

[render]
max_cuda_memory_fraction = 0.20
sh_degree = "auto"
alpha_threshold = 0.20
geometry_supported_occlusion = true
geometry_clearance_m = 0.16
geometry_height_max_m = 0.65

[navigation]
show_route = true
route_width_m = 0.045
goal_radius_m = 0.26
inset_width_px = 240
inset_height_px = 160
ground_band_m = 0.08
ground_radius_m = 0.25
